name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest is moving to 26.04 during the hackathon
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint needs the history
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up the database
        run: npm run db:setup

      - name: Commit messages (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Commit message (push)
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: File size
        run: npm run check:file-size

      - name: No AI/ML in the app
        run: npm run check:no-ai

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
